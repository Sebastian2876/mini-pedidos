version: '3.8'

services:
  rabbitmq1:
    image: rabbitmq:4.0-management
    container_name: rabbitmq1
    hostname: rabbitmq1
    environment:
      RABBITMQ_ERLANG_COOKIE: 'MY_SECRET_COOKIE_123'
      RABBITMQ_DEFAULT_USER: 'guest'
      RABBITMQ_DEFAULT_PASS: 'guest'
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - rabbit-net

  rabbitmq2:
    image: rabbitmq:4.0-management
    container_name: rabbitmq2
    hostname: rabbitmq2
    environment:
      RABBITMQ_ERLANG_COOKIE: 'MY_SECRET_COOKIE_123'
    depends_on:
      - rabbitmq1
    ports:
      - "5673:5672"
      - "15673:15672"
    networks:
      - rabbit-net

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    container_name: elasticmq
    ports:
      - "9324:9324"
    volumes:
      - ./elasticmq/custom.conf:/opt/elasticmq/conf/custom.conf
    networks:
      - rabbit-net

networks:
  rabbit-net:
    driver: bridge